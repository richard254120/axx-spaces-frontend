<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="acxXHKL9HfK1Imq_t5JVwU0Ht0arkGZjnb2n7aWKjvE" />
  <!-- Favicon and App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Speed up the two third-party origins that are on every listing page:
       listing photos come from Cloudinary, API calls go to Render. -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://axx-spaces-backend-1.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://axx-spaces-backend-1.onrender.com" />

  <!-- Web fonts: preconnect + non-blocking stylesheet.
       The previous URL used an invalid axis syntax ("12..96,500;600;700;800")
       and Google Fonts answered HTTP 400, so the brand fonts never loaded and
       the request was wasted on every page view. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&display=swap"
    media="print"
    onload="this.media='all'"
  />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axxspace</title>

  <!-- CSP MUST come before any scripts so it applies to them -->
  <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
          https://www.googletagmanager.com
          https://www.google-analytics.com
          https://www.clarity.ms
          https://clarity.ms
          https://scripts.clarity.ms
          https://accounts.google.com
          https://accounts.google.com/gsi/client
          https://apis.google.com;
        style-src 'self' 'unsafe-inline'
          https://fonts.googleapis.com
          https://unpkg.com;
        img-src 'self' data: https: blob:;
        font-src 'self' data:
          https://fonts.gstatic.com
          https://fonts.googleapis.com
          https://unpkg.com;
        connect-src 'self'
          http://localhost:1000
          ws://localhost:1000
          https://axx-spaces-backend-1.onrender.com
          wss://axx-spaces-backend-1.onrender.com
          https://*.tile.openstreetmap.org
          https://www.google-analytics.com
          https://analytics.google.com
          https://stats.g.doubleclick.net
          https://www.google.com
          https://*.clarity.ms
          https://clarity.ms
          https://c.bing.com
          https://region1.google-analytics.com
          https://region1.analytics.google.com
          https://accounts.google.com
          https://oauth2.googleapis.com;
        frame-src 'self'
          https://accounts.google.com
          https://apis.google.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      " />


  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Axxspace is Kenya's premier platform for property rentals, moving services, building materials, and tourism. Find homes, book movers, shop materials, and explore hotels across all 47 counties." />
  <meta name="keywords"
    content="Axxspace, Kenya, property rentals, moving services, building materials, tourism, hotels, Nairobi, Mombasa, Kisumu, real estate, house for rent, movers, construction materials" />
  <meta name="author" content="Axxspace" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph Meta Tags for Social Media & Search Browsers -->
  <meta property="og:title" content="Axxspace" />
  <meta property="og:description"
    content="Find homes, book movers, shop materials, and explore hotels across all 47 counties. No agents, no hidden fees." />
  <meta property="og:image" content="https://axxspace.com/og-image.png" />
  <meta property="og:image:secure_url" content="https://axxspace.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Axxspace Official Logo" />
  <meta property="og:url" content="https://axxspace.com" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Axxspace" />
  <meta property="og:locale" content="en_KE" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Axxspace" />
  <meta name="twitter:description"
    content="Find homes, book movers, shop materials, and explore hotels across all 47 counties. No agents, no hidden fees." />
  <meta name="twitter:image" content="https://axxspace.com/og-image.png" />
  <meta name="twitter:image:alt" content="Axxspace Official Logo" />

  <!-- Structured Data (JSON-LD) for Google Search and Browser Logos -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Axxspace",
    "url": "https://axxspace.com",
    "logo": "https://axxspace.com/logo.png",
    "image": "https://axxspace.com/og-image.png",
    "description": "Kenya's premier platform for property rentals, moving services, building materials, and tourism.",
    "address": {
      "@type": "PostalAddress",
      "addressCountry": "KE"
    }
  }
  </script>

  <!-- Additional SEO & Application Tags -->
  <meta name="theme-color" content="#022753" />
  <meta name="msapplication-TileColor" content="#022753" />
  <meta name="msapplication-TileImage" content="/logo192.png" />

  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9J06HNJ4T1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-9J06HNJ4T1');
  </script>

  <!-- Microsoft Clarity is loaded after the page is interactive so it never
       competes with React hydration for the main thread. -->
  <script type="text/javascript">
    window.addEventListener('load', function () {
      setTimeout(function () {
        try {
          (function (c, l, a, r, i, t, y) {
            c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments) };
            t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
            t.onerror = function () { console.log('Clarity script blocked by ad blocker'); };
            y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
          })(window, document, "clarity", "script", "wxnk54e8dy");
        } catch (e) {
          console.log('Clarity script failed to load:', e);
        }
      }, 1200);
    });
  </script>

  <!-- Google Identity Services is injected on demand by useGoogleSignIn()
       only on the pages that actually render a Google button. -->

</head>
